<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>臺藝圖文浮洲島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: a 3D open world of 16 floating hex islands joined by plank bridges.
   Stage on the left, island details on the right (desktop) or as a bottom sheet (phone).
   Print-shop cues: CMYK colour bar, halftone dots, registration marks. */
:root{
  --display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --bg:#F3F7F9; --panel:#FFFFFF; --fg:#1E2328; --muted:#56646E; --border:#C8D6DD; --line:#1E2328;
  --accent:#E6007E; --accent-fg:#FFFFFF; --shadow:rgba(30,35,40,.2); --stage:#DCEBF1;
  --cy-t:#8ED8F0; --ma-t:#F7A3CF; --ye-t:#FFE97D; --gr-t:#A4E3B6; --or-t:#FFBB92; --vi-t:#C3B2F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --panel:#16212A; --fg:#EAF1F4; --muted:#9DB0BB; --border:#2A3C47; --line:#0A0F13;
    --accent:#FF3C9E; --accent-fg:#16212A; --shadow:rgba(0,0,0,.45); --stage:#0E1A22;
    --cy-t:#2B86A4; --ma-t:#A8407A; --ye-t:#9A8418; --gr-t:#2F8250; --or-t:#A9552F; --vi-t:#6551AC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --panel:#16212A; --fg:#EAF1F4; --muted:#9DB0BB; --border:#2A3C47; --line:#0A0F13;
  --accent:#FF3C9E; --accent-fg:#16212A; --shadow:rgba(0,0,0,.45); --stage:#0E1A22;
  --cy-t:#2B86A4; --ma-t:#A8407A; --ye-t:#9A8418; --gr-t:#2F8250; --or-t:#A9552F; --vi-t:#6551AC;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5.6vw,46px);line-height:1.1;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.sub{margin:0;color:var(--muted);max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:0;display:flex}
.search input{width:100%;min-width:0;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);flex-basis:100%;min-height:18px}

.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:18px;align-items:start}
.stage{position:relative;height:min(76vh,700px);min-height:420px;border:2px solid var(--line);border-radius:20px;overflow:hidden;background:var(--stage)}
#gl{position:absolute;inset:0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;border:2px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:999px;padding:1px 10px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.5;box-shadow:0 2px 0 var(--line)}
.tag.sel{background:var(--accent);color:var(--accent-fg)}
.say{position:absolute;left:0;top:0;pointer-events:none;max-width:210px;width:max-content;background:#fff;color:#1E2328;border:2px solid var(--line);border-radius:14px;padding:5px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 2px 0 var(--line);z-index:5;white-space:normal;text-align:left;animation:sayIn .18s ease-out}
.chatbox{display:flex;gap:8px;margin:8px 0}
.chatbox input{flex:1;min-width:0;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg)}
.chatlog{list-style:none;margin:10px 0 0;padding:8px 10px;max-height:150px;overflow:auto;border:2px dashed var(--border);border-radius:12px;font-size:13px}
.chatlog li{padding:2px 0}.chatlog b{color:var(--muted);margin-right:6px;font-weight:700}.chatlog .empty{color:var(--muted)}
.say b{display:block;font-size:11px;color:#E6007E;margin-bottom:1px}
.say.npc{background:#FFF6C9}
.say.boss{background:#FFD6E8;border-color:#E6007E;max-width:240px}
.bosschk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0;color:var(--fg)}
#bossBanner{display:none;position:absolute;left:12px;right:12px;top:56px;z-index:8;pointer-events:none;background:#FFD6E8;color:#1E2328;border:2px solid #E6007E;border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.5;box-shadow:0 2px 0 #1E2328;animation:sayIn .2s ease-out}
#bossBanner b{color:#B5004F;margin-right:4px}.say.stu{background:#E9F8FF}
@keyframes sayIn{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
@media (prefers-reduced-motion:reduce){.say{animation:none}}
.tag.dim{opacity:.35}
.tag.boss{background:#FFA6C8;color:#23282D;border-color:#23282D}
.tag.boss.sel{background:var(--accent);color:var(--accent-fg)}
.hud{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.hud button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.5}
.qopt.ok{background:#CFF3D8;color:#14361F}.qopt.bad{background:#FFD0D6;color:#4A1020}.qopt:disabled{cursor:default}
.qq{margin:6px 0}.qfb{font-size:13.5px;margin:10px 0}.qok{font-weight:700;color:#1F7A3E}
.tag.greet{background:#FFE36B;color:#23282D;font-weight:700;font-size:13px;animation:pop .35s ease-out}
.tag.act{background:#7BE0A8;color:#10301F;font-weight:700;font-size:13px;animation:pop .35s ease-out}
.tag.act.wait{background:#E9EEF1;color:#3C4A53}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
#onlinePill{position:absolute;left:12px;top:12px;z-index:6;pointer-events:none;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
#greetToast{display:none;position:absolute;left:12px;right:12px;bottom:70px;z-index:8;max-width:360px;margin:0 auto;cursor:pointer;background:#E9F8FF;color:#1E2328;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);text-align:center}
.hot{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:6px}.hot li{display:flex;align-items:center;gap:8px}.hot .ix{flex:1}.hot span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.skybox{position:absolute;right:12px;top:52px;z-index:9;width:min(290px,calc(100% - 24px));background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.skybox[hidden]{display:none}.skybox h4{margin:0 0 8px;font-size:15px}
.skybox label{display:block;font-size:12px;font-weight:600;margin-top:8px}
.skybox select{display:block;width:100%;margin-top:3px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);font:inherit;font-size:14px}
.skyinfo{white-space:pre-line;font-size:12.5px;margin:10px 0 4px;line-height:1.55}.skynote{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.hint{position:absolute;left:12px;bottom:26px;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:3px 9px;pointer-events:none;max-width:calc(100% - 140px)}
.cmyk{position:absolute;left:0;right:0;bottom:0;display:flex;height:14px;border-top:2px solid var(--line)}
.cmyk i{flex:1}.cmyk i:nth-child(1){background:#00A9E0}.cmyk i:nth-child(2){background:#E6007E}.cmyk i:nth-child(3){background:#FFD400}.cmyk i:nth-child(4){background:#23282D}.cmyk i:nth-child(5){background:#fff}.cmyk i:nth-child(6){background:#8a9399}
.joy{position:absolute;right:16px;bottom:34px;width:104px;height:104px;border-radius:50%;border:2px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);touch-action:none;display:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--accent);border:2px solid var(--line)}
@media (hover:none) and (pointer:coarse){.joy{display:block}.hint{display:none}}
.fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.panel h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.2;margin:6px 0 8px}
.panel h3{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:500}
.panel p{margin:0}
.hello{display:flex;gap:12px;align-items:flex-start}
.drop{flex:none;width:44px;height:52px}
.bubble{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.ixgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ix{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 10px;text-align:left;cursor:pointer;min-width:0;font-size:14px;font-weight:500}
.ix i{flex:none;width:14px;height:14px;border-radius:4px;background:var(--t);border:2px solid var(--line)}
.ix.dim{opacity:.35}
.back{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.kind{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--t);color:var(--fg);border:2px solid var(--line);font-size:12px;font-weight:700}
.things{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.things li{border:2px solid var(--border);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.things b{font-weight:700}.things span{color:var(--muted);font-size:14px}
.cl{display:flex;flex-wrap:wrap;gap:6px}
.cl span{border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px;background:var(--panel);display:inline-flex;gap:6px;align-items:baseline}
.cl em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span,.tags button{border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;background:var(--panel)}
.tags button{cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tags button i{width:10px;height:10px;border-radius:3px;background:var(--t);border:1.5px solid var(--line)}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.rules dt{font-weight:700;white-space:nowrap}.rules dd{margin:0;color:var(--muted)}
.note{margin-top:18px;font-size:12.5px;color:var(--muted);border-top:2px dashed var(--border);padding-top:12px}

.tag.stu{background:#FFF6C9;color:#23282D;font-weight:500;font-size:12px;padding:0 8px}
.tag.stu.sel{background:var(--accent);color:var(--accent-fg)}
.pvwrap{display:flex;justify-content:center;margin:10px 0;background:var(--bg);border:2px solid var(--line);border-radius:16px}
#pv{width:220px;height:220px}#pv canvas{display:block}
.lbl{display:block;margin-top:12px;font-size:13px;font-weight:700}
.lbl input,.lbl select,.lbl textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:inherit;font-weight:400}
.optrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.actrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actrow button{border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--panel);color:var(--fg)}
.actrow .primary{background:var(--accent);color:var(--accent-fg)}.actrow button:disabled{opacity:.5}

@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{height:54vh;min-height:360px}
  .panel{position:static;max-height:none}
  #detail{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:46vh;overflow:auto;background:var(--panel);border-top:2px solid var(--line);border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  body.sel{padding-bottom:calc(46vh + 20px)}
}
@media (min-width:900px){body.sel #welcome{display:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">NTUA · Graphic Communication Arts · Open World</div>
    <h1>臺藝圖文<span>浮洲島</span></h1>
    <p class="sub">16 座島用橋連成一片大陸。走走看，或點任何一座島，查看課程、設備與活動。</p>
  </header>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="搜尋課程、設備、社團，例如：攝影、統計、燙金、Python" aria-label="搜尋浮洲島"></div>
    <div class="chips" id="chips" role="group" aria-label="依類型篩選">
      <button class="chip" data-cat="all" aria-pressed="true">全部</button>
      <button class="chip" data-cat="equip" aria-pressed="false">設備</button>
      <button class="chip" data-cat="course" aria-pressed="false">課程</button>
      <button class="chip" data-cat="social" aria-pressed="false">交流</button>
      <button class="chip" data-cat="club" aria-pressed="false">社團</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <div id="gl"></div>
      <div id="labels"></div>
      <div class="hud"><button id="bOver">總覽</button><button id="bFollow">跟著我</button><button id="bSave" aria-pressed="false" title="降低畫質與動畫，節省電力與發熱">省電：關</button><button id="bMe">我的角色</button></div>
      <div class="hint">WASD／方向鍵走動 · 拖曳旋轉 · 滾輪縮放 · 點島嶼自動前往 · 點居民、BOSS、小滴聊聊天 · 走近 YouBike／公車站牌按提示（E 鍵）</div>
      <div class="joy" id="joy" aria-label="虛擬搖桿"><i id="knob"></i></div>
      <div class="cmyk" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <aside class="panel" id="panel">
      <div id="welcome">
        <div class="hello">
          <svg class="drop" viewBox="-14 -20 28 34" aria-hidden="true"><path d="M0,-14C7,-5 9,-1 9,4A9,9 0 1 1 -9,4C-9,-1 -7,-5 0,-14Z" fill="var(--accent)" stroke="var(--line)" stroke-width="1.6"/><circle cx="-3" cy="3" r="1.5" fill="#23282D"/><circle cx="3" cy="3" r="1.5" fill="#23282D"/><path d="M-2,6.5Q0,8.5 2,6.5" fill="none" stroke="#23282D" stroke-width="1.2"/></svg>
          <div class="bubble">嗨，我是小滴！你現在控制我在島上走動。戴著豬頭帽的是 BOSS 波客老師，去課程島找他打招呼吧。</div>
        </div>
        <div id="hot"></div>
        <h3>全部島嶼</h3>
        <div class="ixgrid" id="ixgrid"></div>
        <p class="note" id="src"></p>
      </div>
      <div id="detail" hidden></div>
    </aside>
  </div>
</div>

<script src="props.js"></script>
<script src="city.js"></script>
<script src="data.js"></script>
<script src="ocean.js"></script>
<script src="sky.js"></script>

<script src="talk.js"></script>
<script src="quiz.js"></script>
<script src="students.js"></script>

<script>
function boot(DATA){
  var D=DATA.islands,CAT={equip:'設備',course:'課程',social:'交流',club:'社團'};
  var state={q:'',cat:'all'};
  var byId={};D.forEach(function(d){byId[d.id]=d;
    d.hay=(d.name+' '+d.blurb+' '+(d.keys||'')+' '+d.equip.map(function(t){return t[0]+t[1];}).join(' ')+' '+d.courses.map(function(c){return c[0];}).join(' ')+' '+d.acts.join(' ')).toLowerCase();});
  var $=function(s){return document.querySelector(s);};
  var detail=$('#detail'),ixg=$('#ixgrid'),statusEl=$('#status');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function isDark(){var t=document.documentElement.getAttribute('data-theme');return t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);}

  ixg.innerHTML=D.map(function(d){return '<button class="ix" data-id="'+d.id+'" style="--t:var(--'+d.hue+'-t)"><i></i><span>'+esc(d.name)+'</span></button>';}).join('');

  var ok=World.init({el:$('#gl'),labels:$('#labels'),data:DATA,dark:isDark(),onSelect:onSelect,
    onError:function(){$('#stage').insertAdjacentHTML('beforeend','<div class="fail">這個瀏覽器無法顯示 3D 畫面。請改用最新版 Chrome、Safari 或 Edge，並開啟硬體加速。</div>');}});

  function matches(d){
    var q=state.q.trim().toLowerCase();
    return (state.cat==='all'||d.cats.indexOf(state.cat)>-1)&&(!q||d.hay.indexOf(q)>-1);
  }
  function applyFilter(){
    var n=0;
    D.forEach(function(d){var m=matches(d);if(m)n++;var b=ixg.querySelector('[data-id="'+d.id+'"]');if(b)b.classList.toggle('dim',!m);});
    if(ok)World.setFilter(state.q.trim()||state.cat!=='all'?matches:null);
    statusEl.textContent=(state.q.trim()||state.cat!=='all')?(n?('找到 '+n+' 座島'):'沒有符合的島，換個關鍵字試試'):'';
  }

  function onSelect(id){
    if(!id){document.body.classList.remove('sel');detail.hidden=true;detail.innerHTML='';return;}
    document.body.classList.add('sel');
    detail.innerHTML=id==='boss'?bossHTML():id.indexOf('s:')===0?Students.html(id):islandHTML(byId[id]);
    detail.hidden=false;detail.scrollTop=0;
    if(window.innerWidth<900)$('#stage').scrollIntoView({block:'start',behavior:'smooth'});
  }
  function rulesHTML(){return '<h3>畢業規定（113 學年度）</h3><dl class="rules">'+DATA.rules.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>';}
  function bossHTML(){
    return '<button class="back" data-act="back">← 回到總覽</button>'+
      '<div style="margin-top:12px"><span class="kind" style="--t:#FFA6C8">BOSS</span></div><h2>波客老師</h2>'+
      '<p>歡迎來到臺藝圖文浮洲島！每座島都連著課程、設備與活動，慢慢逛，找到你想去的地方。</p>'+
      '<h3>先去哪裡？</h3><div class="tags"><button data-go="courses" style="--t:var(--ma-t)"><i></i>課程島：畢業規定與核心必修</button><button data-go="harbor" style="--t:var(--vi-t)"><i></i>浮洲碼頭：新生入口</button></div>'+
      '<p class="note">示範內容，請以系上公告為準。</p>';
  }
  function islandHTML(d){
    var h='<button class="back" data-act="back">← 回到總覽</button>'+
      '<div style="margin-top:12px"><span class="kind" style="--t:var(--'+d.hue+'-t)">'+esc(d.cats.map(function(c){return CAT[c];}).join('・'))+'</span></div>'+
      '<h2>'+esc(d.name)+'</h2><p>'+esc(d.blurb)+'</p>';
    if(d.courses.length)h+='<h3>課程（'+d.courses.length+'）</h3><div class="cl">'+d.courses.map(function(c){return '<span>'+esc(c[0])+'<em>'+esc(c[1])+'</em></span>';}).join('')+'</div>';
    if(d.equip.length)h+='<h3>設備與空間</h3><ul class="things">'+d.equip.map(function(t){return '<li><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></li>';}).join('')+'</ul>';
    if(d.acts.length)h+='<h3>活動</h3><div class="tags">'+d.acts.map(function(a){return '<span>'+esc(a)+'</span>';}).join('')+'</div>';
    if(d.id==='courses')h+=rulesHTML();
    if(window.Quiz)h+=Quiz.section(d.id);
    h+='<h3>走橋就到的鄰島</h3><div class="tags">'+d.nb.map(function(id){var o=byId[id];return '<button data-go="'+id+'" style="--t:var(--'+o.hue+'-t)"><i></i>'+esc(o.name)+'</button>';}).join('')+'</div>';
    h+='<p class="note">課程依 113 學年度日間學士班課程地圖整理；設備與活動為示範內容，請以系上實際資料為準。</p>';
    return h;
  }

  detail.addEventListener('click',function(e){
    if(e.target.closest('[data-act="back"]')){World.clear();return;}
    var g=e.target.closest('[data-go]');if(g)World.select(g.dataset.go,true);
  });
  ixg.addEventListener('click',function(e){var b=e.target.closest('.ix');if(b)World.select(b.dataset.id,true);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')World.clear();});
  $('#q').addEventListener('input',function(e){state.q=e.target.value;applyFilter();});
  $('#chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;state.cat=b.dataset.cat;
    [].forEach.call(document.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});applyFilter();});
  $('#bOver').addEventListener('click',function(){World.overview();});
  $('#bFollow').addEventListener('click',function(){World.follow();});
  // 省電模式：記住選擇；沒選過時，電量低、系統開啟省流量或偏好減少動態就自動開啟
  (function(){
    var bs=$('#bSave'),KEY='fz_saver';
    function get(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
    function put(v){try{localStorage.setItem(KEY,v);}catch(e){}}
    function apply(on){bs.setAttribute('aria-pressed',on?'true':'false');bs.textContent=on?'省電：開':'省電：關';if(ok)World.setSaver(on);}
    bs.addEventListener('click',function(){var on=bs.getAttribute('aria-pressed')!=='true';put(on?'1':'0');apply(on);});
    var saved=get();
    if(saved==='1'||saved==='0'){apply(saved==='1');return;}
    var c=navigator.connection||{};
    if(c.saveData||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){apply(true);return;}
    if(navigator.getBattery)navigator.getBattery().then(function(b){if(!b.charging&&b.level<=.2&&get()===null)apply(true);}).catch(function(){});
  })();

  // theme follow
  function theme(){if(ok)World.setTheme(isDark()?'dark':'light');}
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // joystick
  var joy=$('#joy'),knob=$('#knob'),jp=null;
  function jmove(e){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2),l=Math.hypot(dx,dy);
    if(l>1){dx/=l;dy/=l;}knob.style.transform='translate('+(dx*30)+'px,'+(dy*30)+'px)';if(ok)World.setJoystick(dx,-dy);}
  joy.addEventListener('pointerdown',function(e){jp=e.pointerId;joy.setPointerCapture(jp);jmove(e);e.stopPropagation();});
  joy.addEventListener('pointermove',function(e){if(e.pointerId===jp)jmove(e);});
  function jend(e){if(e.pointerId!==jp)return;jp=null;knob.style.transform='';if(ok)World.setJoystick(0,0);}
  joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);

  var src=$('#src');
  if(src)src.textContent=DATA.updated?('資料來源：Google Sheet，更新於 '+new Date(DATA.updated).toLocaleString('zh-TW')):'資料來源：內建示範資料';
  var cfg=window.ISLAND_CONFIG||{};
  if(window.Talk)Talk.set(DATA.talk);
  if(window.Quiz)Quiz.init({detail:detail,D:D,api:cfg.API_URL||''});
  Students.init({D:D,detail:detail,cfg:{api:cfg.API_URL||'',clientId:cfg.GOOGLE_CLIENT_ID||''}});
  $('#bMe').addEventListener('click',function(){Students.open();});
  if(ok&&window.Sky)Sky.init();
  applyFilter();
}

/* 資料載入：config.js 填了 API_URL 就讀 Google Sheet，失敗時退回內建資料 */
(function(){
  var HUES={cy:1,ma:1,ye:1,gr:1,or:1,vi:1},LMS='lightbox press screen wheel printer computer cutter camera phone chat book chart briefcase lighthouse flag frame'.split(' ');
  function arr(x){return Array.isArray(x)?x:[];}
  function sanitize(j){
    var seen={},out=[];
    arr(j&&j.islands).forEach(function(d){
      if(!d||!d.id||seen[d.id]||isNaN(+d.q)||isNaN(+d.r))return;seen[d.id]=1;
      out.push({id:String(d.id),name:String(d.name||d.id),q:+d.q,r:+d.r,hue:HUES[d.hue]?d.hue:'cy',
        landmark:LMS.indexOf(d.landmark)>-1?d.landmark:'book',acc:d.acc||'',
        cats:arr(d.cats).length?d.cats:['course'],blurb:String(d.blurb||''),keys:String(d.keys||''),
        equip:arr(d.equip),courses:arr(d.courses),acts:arr(d.acts)});
    });
    if(!out.length)throw new Error('no islands');
    return {rules:arr(j.rules),islands:out,updated:j.updated,talk:j.talk};
  }
  var url=(window.ISLAND_CONFIG||{}).API_URL,done=false;
  function fallback(why){if(done)return;done=true;if(why)console.warn('改用內建資料：',why);boot(window.WORLD_DATA);}
  if(!url){fallback();return;}
  var timer=setTimeout(function(){fallback('讀取逾時');},8000);
  fetch(url).then(function(r){return r.json();}).then(function(j){
    if(done)return;if(j&&j.error)throw new Error(j.error);
    var d=sanitize(j);done=true;clearTimeout(timer);boot(d);
  }).catch(function(e){clearTimeout(timer);fallback(e&&e.message);});
})();
</script>
